<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Criar - Perfil</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;padding-bottom:80px}.top{height:56px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff}.tabs{display:flex;gap:8px;padding:12px 16px}.tabs button{flex:1;padding:10px;border:1px solid #ddd;background:#fff;border-radius:20px;font-weight:700;cursor:pointer}.tabs button.active{background:#000;color:#fff}.box{padding:16px}input[type=file]{display:none}.pick{border:2px dashed #ddd;border-radius:12px;padding:30px;text-align:center;cursor:pointer;color:#666}#preview img,#preview video{width:100%;border-radius:12px}textarea{width:100%;min-height:80px;margin-top:12px;padding:12px;border:1px solid #ddd;border-radius:10px;font-family:inherit}.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;border-radius:12px;font-weight:700;margin-top:12px;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#121214;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;align-items:center}.bottom a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#8e8e93}</style></head>
<body>
<header class="top"><button onclick="history.back()" style="border:none;background:none;font-size:20px">✕</button><b>Criar post - Perfil</b></header>
<div class="tabs" id="modes">
  <button data-mode="POST" class="active">POST</button>
  <button data-mode="VIDEO">VÍDEO</button>
  <button data-mode="VIRAL">VIRAL</button>
</div>
<div class="box">
  <label class="pick" for="file">📷 Toque para escolher foto / vídeo<input type="file" id="file" accept="image/*,video/*"></label>
  <div id="preview"></div>
  <textarea id="legenda" placeholder="Escreva uma legenda..."></textarea>
  <button class="btn" id="share">Compartilhar</button>
  <p style="color:#8e8e93;font-size:13px;text-align:center" id="info">POST / VÍDEO vai pra Home.<br>VIRAL vai pro Virais.</p>
</div>
<nav class="bottom"><a href="./passo4.html">⌂</a><a href="./passo3.html">+</a><a href="./passo2.html">▶</a><a href="./passo1.html">👤</a></nav>
<script>
let mode='POST', midia='', isVideo=false, fileBlob=null;
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#modes button').forEach(x=>x.classList.remove('active'));b.classList.add('active');mode=b.dataset.mode;});
function salvarVideoDB(id, blob){ return new Promise((res,rej)=>{ let req=indexedDB.open('koneat_db',1); req.onupgradeneeded=e=>{ e.target.result.createObjectStore('videos'); }; req.onsuccess=e=>{ let db=e.target.result; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').put(blob, 'vid_'+id); tx.oncomplete=()=>res(); tx.onerror=()=>rej(); }; req.onerror=()=>rej(); }); }
function comprimirFoto(dataUrl, cb){ let img=new Image(); img.onload=()=>{ let max=900, w=img.width, h=img.height; if(w>max){h=h*max/w;w=max;} if(h>max){w=w*max/h;h=max;} let c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); cb(c.toDataURL('image/jpeg',0.72)); }; img.src=dataUrl; }
document.getElementById('file').onchange=e=>{
  let f=e.target.files[0]; if(!f) return; isVideo=f.type.startsWith('video/'); fileBlob=f;
  document.getElementById('info').textContent='Arquivo: '+(f.size/1024/1024).toFixed(2)+' MB - '+(isVideo?'vídeo':'foto');
  let r=new FileReader(); r.onload=()=>{ if(!isVideo){ comprimirFoto(r.result, mini=>{midia=mini; document.getElementById('preview').innerHTML=`<img src="${midia}">`;}); } else { midia=r.result; document.getElementById('preview').innerHTML=`<video src="${midia}" controls playsinline></video>`; } }; r.readAsDataURL(f);
};
document.getElementById('share').onclick=async()=>{
  if(!midia){ alert('Escolha foto ou vídeo primeiro'); return; }
  if(mode==='VIRAL' && !isVideo){ alert('VIRAL só aceita vídeo!'); return; }
  let id=Date.now(); let tipo=mode==='VIRAL'?'VIRAL':'FEED';
  let posts=JSON.parse(localStorage.getItem('koneat_posts')||'[]');
  if(isVideo){
    try{ await salvarVideoDB(id, fileBlob); }catch(e){ alert('Erro ao salvar vídeo no celular'); return; }
    posts.unshift({id, tipo, midia:'', url:'', legenda:document.getElementById('legenda').value, capa:'', data:id, author:'koneat_user', source:'profile', videoId:'vid_'+id});
  } else {
    posts.unshift({id, tipo, midia, url:midia, legenda:document.getElementById('legenda').value, capa:'', data:id, author:'koneat_user', source:'profile'});
  }
  localStorage.setItem('koneat_posts',JSON.stringify(posts));
  alert('Salvo! Indo para '+(tipo==='VIRAL'?'Virais':'Home'));
  location.href=tipo==='VIRAL'?'./passo2.html':'./passo4.html';
};
</script></body></html>

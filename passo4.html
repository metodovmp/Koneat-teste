<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Koneat - Home</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#000;padding-bottom:80px}.top{height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:10}.logo{font-size:22px;font-weight:800;letter-spacing:-.8px}.sub{display:flex;gap:24px;padding:12px 16px;border-bottom:1px solid #eee;position:sticky;top:56px;background:#fff}.sub b{border-bottom:2px solid #000;padding-bottom:4px}.stories{display:flex;gap:12px;padding:16px;overflow-x:auto;border-bottom:1px solid #eee}.story{flex-shrink:0;text-align:center;cursor:pointer}.story .av{width:66px;height:66px;border-radius:50%;background:#e5e5ea;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}.story .av img,.story .av video{width:100%;height:100%;object-fit:cover}.post{border-bottom:1px solid #eee;margin-bottom:12px}.ph{display:flex;justify-content:space-between;align-items:center;padding:12px 16px}.media{aspect-ratio:1;background:#f2f2f7;overflow:hidden}.media img,.media video{width:100%;height:100%;object-fit:cover}.actions{display:flex;gap:16px;padding:12px 16px}.cap{padding:0 16px 12px;font-size:14px}.empty{text-align:center;padding:60px 20px;color:#8e8e93}.del{background:#000;color:#fff;border:none;padding:4px 10px;border-radius:12px;font-size:11px;margin-left:8px;cursor:pointer}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#121214;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;align-items:center}.bottom a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#8e8e93}</style></head>
<body>
<header class="top"><div class="logo">koneat</div><div>🔍 🔔</div></header>
<div class="sub"><b>pra você</b><span>seguindo</span><span>explorar</span></div>
<div class="stories" id="stories"></div>
<div id="feed"></div>
<nav class="bottom">
<a href="./passo4.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="#fff"><path d="M22 20v-7.826a2 2 0 0 0-.613-1.43l-8-7.826a2 2 0 0 0-2.774 0l-8 7.826A2 2 0 0 0 2 12.174V20a2 2 0 0 0 2 2h4.5a.5.5 0 0 0 .5-.5v-5a2.5 2.5 0 0 1 5 0v5a.5.5 0 0 0 .5.5H19a2 2 0 0 0 2-2z"/></svg></a>
<a href="./passo3.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="none"><rect x="2" y="2" width="20" height="20" rx="5" stroke="#8e8e93" stroke-width="1.8"/><path d="M12 7v10M7 12h10" stroke="#8e8e93" stroke-width="1.8" stroke-linecap="round"/></svg></a>
<a href="./passo2.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8e8e93" stroke-width="1.8"><rect x="2" y="2" width="20" height="20" rx="5"/><polygon points="10,8 16,12 10,16"/></svg></a>
<a href="./passo1.html"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#8e8e93" stroke-width="1.8"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></a>
</nav>
<script>
function getPosts(){return JSON.parse(localStorage.getItem('koneat_posts')||'[]')}
function isExpired(p){return p.tipo==='STORY' && p.expiresAt && Date.now()>p.expiresAt}
function delStory(id){let p=getPosts().filter(x=>String(x.id)!==String(id)); localStorage.setItem('koneat_posts',JSON.stringify(p)); render();}
function render(){
  let all=getPosts().filter(p=>!isExpired(p));
  let stories=all.filter(p=>p.tipo==='STORY');
  let feed=all.filter(p=>p.tipo==='FEED');
  document.getElementById('stories').innerHTML=`<div class="story" onclick="location.href='./passo3.html?mode=STORY'"><div class="av">👤<span style="position:absolute;bottom:0;right:0;background:#000;color:#fff;border-radius:50%;width:20px;height:20px">+</span></div><div style="font-size:12px">seu story</div></div>`+stories.map(s=>{let m=s.midia||s.url||''; let isV=m.startsWith('data:video'); return `<div class="story"><div class="av">${isV?`<video src="${m}" muted playsinline></video>`:`<img src="${m}">`}</div><div style="font-size:12px">você <button class="del" onclick="event.stopPropagation();delStory(${s.id})">✕</button></div></div>`}).join('');
  document.getElementById('feed').innerHTML=feed.length===0?`<div class="empty">Nenhuma publicação no momento.</div>`:feed.map(p=>{let m=p.midia||p.url||''; let isV=m.startsWith('data:video')||/\.mp4/i.test(m); return `<div class="post"><div class="ph"><b>@${p.author||'koneat_user'}</b><button style="background:#000;color:#fff;border:none;padding:6px 14px;border-radius:16px">Seguir</button></div><div class="media">${isV?`<video src="${m}" autoplay loop muted playsinline></video>`:`<img src="${m}">`}</div><div class="actions">♡ 💬 ↗️</div>${p.legenda?`<div class="cap"><b>@${p.author||'koneat_user'}</b> ${p.legenda}</div>`:''}</div>`}).join('');
}
document.addEventListener('DOMContentLoaded',render);
</script></body></html>

<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Perfil</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;padding-bottom:70px}.top{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px}.perfil{padding:16px;text-align:center}.avatar{width:90px;height:90px;border-radius:50%;background:#eee;margin:0 auto;display:flex;align-items:center;justify-content:center;font-size:40px}.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:2px;padding:2px}.item{aspect-ratio:1;background:#000;position:relative;overflow:hidden;cursor:pointer}.item img{width:100%;height:100%;object-fit:cover;display:block}.item span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:30px}.btn{padding:10px 18px;background:#000;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#121214;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;align-items:center}.bottom a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#8e8e93}#modal{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:99;padding:16px}#modal.open{display:flex}#modal .box{background:#fff;border-radius:14px;overflow:hidden;width:100%;max-width:420px;color:#000}#modal img,#modal video{width:100%;display:block;max-height:60vh;object-fit:cover}.del{width:100%;padding:12px;background:#ff3b30;color:#fff;border:none;border-radius:10px;font-weight:700;margin-top:10px}.fechar{width:100%;padding:10px;border:1px solid #ddd;background:#fff;border-radius:10px;margin-top:8px}</style></head>
<body><header class="top"><b>koneat_user</b><span>☰</span></header>
<div class="perfil"><div class="avatar">👤</div><h3 style="margin:8px 0 4px">Koneat User</h3><p style="color:#888;font-size:13px;margin:0" id="cont">0 publicações</p><button class="btn" onclick="location.href='./criar.html'">+ Crie seu primeiro post</button></div>
<div class="grid" id="grid"></div>
<div id="modal" onclick="if(event.target.id==='modal') fechar()"><div class="box"><div id="modalMidia"></div><div style="padding:12px"><b>@koneat_user</b><p id="modalLeg" style="margin:6px 0"></p><button class="del" onclick="deletar()">🗑️ Deletar este post</button><button class="fechar" onclick="fechar()">Fechar</button></div></div></div>
<nav class="bottom"><a href="./passo4.html">⌂</a><a href="./passo3.html">+</a><a href="./passo2.html">▶</a><a href="./passo1.html">👤</a></nav>
<script>
let todos=[], atual=null;
function lerVideo(id){ return new Promise(res=>{ let req=indexedDB.open('koneat_db',1); req.onsuccess=e=>{ let db=e.target.result; if(!db.objectStoreNames.contains('videos')) return res(null); let tx=db.transaction('videos','readonly'); let get=tx.objectStore('videos').get(id); get.onsuccess=()=>res(get.result||null); get.onerror=()=>res(null); }; req.onerror=()=>res(null); }); }
function apagarVideo(id){ let req=indexedDB.open('koneat_db',1); req.onsuccess=e=>{ let db=e.target.result; if(!db.objectStoreNames.contains('videos')) return; let tx=db.transaction('videos','readwrite'); tx.objectStore('videos').delete(id); }; }
function fechar(){ document.getElementById('modal').classList.remove('open'); document.getElementById('modalMidia').innerHTML=''; atual=null; }
async function abrir(p){
  atual=p;
  let isVid=!!p.videoId;
  let src=p.capa||p.midia||p.url||'';
  if(isVid){ let blob=await lerVideo(p.videoId); if(blob) src=URL.createObjectURL(blob); }
  if(!src){ document.getElementById('modalMidia').innerHTML='<p style="padding:20px;text-align:center">Vídeo antigo sem capa. Posta um novo pra testar.</p>'; }
  else { document.getElementById('modalMidia').innerHTML = isVid ? `<video src="${src}" controls autoplay playsinline></video>` : `<img src="${src}">`; }
  document.getElementById('modalLeg').textContent = p.legenda || '(sem legenda)';
  document.getElementById('modal').classList.add('open');
}
function deletar(){
  if(!atual) return;
  if(!confirm('Deletar esse post?')) return;
  todos=todos.filter(x=>x.id!==atual.id);
  localStorage.setItem('koneat_posts', JSON.stringify(todos));
  if(atual.videoId) apagarVideo(atual.videoId);
  fechar(); carregar();
}
function carregar(){
  todos=JSON.parse(localStorage.getItem('koneat_posts')||'[]');
  document.getElementById('cont').textContent=todos.length+' publicações';
  let grid=document.getElementById('grid'); grid.innerHTML='';
  todos.forEach(p=>{
    let src=p.capa||p.midia||p.url||'';
    let div=document.createElement('div'); div.className='item'; div.onclick=()=>abrir(p);
    if(src) div.innerHTML=`<img src="${src}">`;
    else div.innerHTML=`<span>${p.videoId?'▶️':'🖼️'}</span>`;
    grid.appendChild(div);
  });
}
carregar();
</script></body></html>

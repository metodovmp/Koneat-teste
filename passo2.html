<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Virais</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#000;color:#fff;padding-bottom:70px}.top{height:56px;display:flex;align-items:center;padding:0 16px}.feed{display:flex;flex-direction:column;gap:16px;padding:0 12px}.card{background:#1a1a1a;border-radius:14px;overflow:hidden}.card video,.card img{width:100%;display:block;max-height:70vh;object-fit:cover}.meta{padding:12px}.bottom{position:fixed;bottom:0;left:0;right:0;height:62px;background:#121214;border-radius:20px 20px 0 0;display:flex;justify-content:space-around;align-items:center}.bottom a{width:48px;height:48px;display:flex;align-items:center;justify-content:center;color:#8e8e93}</style></head>
<body><header class="top"><b>🔥 Virais</b></header><div class="feed" id="feed"></div>
<nav class="bottom"><a href="./passo4.html">⌂</a><a href="./passo3.html">+</a><a href="./passo2.html">▶</a><a href="./passo1.html">👤</a></nav>
<script>
function lerVideo(id){ return new Promise(res=>{ let req=indexedDB.open('koneat_db',1); req.onsuccess=e=>{ let db=e.target.result; if(!db.objectStoreNames.contains('videos')) return res(null); let tx=db.transaction('videos','readonly'); let get=tx.objectStore('videos').get(id); get.onsuccess=()=>res(get.result||null); get.onerror=()=>res(null); }; req.onerror=()=>res(null); }); }
async function carregar(){
  let posts=JSON.parse(localStorage.getItem('koneat_posts')||'[]').filter(p=>p.tipo==='VIRAL');
  let feed=document.getElementById('feed');
  if(!posts.length){ feed.innerHTML='<p style="text-align:center;color:#aaa">Nenhum viral ainda.<br>Posta um vídeo VIRAL no Perfil.</p>'; return; }
  for(let p of posts){
    let src=p.midia||p.url||'';
    if(p.videoId){ let blob=await lerVideo(p.videoId); if(blob) src=URL.createObjectURL(blob); }
    if(!src) continue;
    let d=document.createElement('div'); d.className='card';
    d.innerHTML=`<video src="${src}" controls playsinline loop></video><div class="meta"><b>@koneat_user</b><p>${p.legenda||''}</p></div>`;
    feed.appendChild(d);
  }
}
carregar();
</script></body></html>
